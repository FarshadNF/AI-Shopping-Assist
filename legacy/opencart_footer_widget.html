<!--
Paste this block before </body> in: ...
catalog/view/theme/YOUR_THEME/template/common/footer.twig

Change apiBase to the public URL of the Django AI Shopping Assist API.
If your OpenCart catalog route is different, change catalogRoute too.
-->
<script>
window.AI_SHOPPING_ASSIST_CONFIG = window.AI_SHOPPING_ASSIST_CONFIG || {
  apiBase: 'http://127.0.0.1:8000',
  catalogRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.getCatalog',
  cartRoute: 'index.php?route=checkout/cart',
  productRoute: 'index.php?route=product/product',
  searchRoute: 'index.php?route=product/search',
  cartInfoRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.getCart',
  cartActionRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.cartAction',
  checkoutRoute: 'index.php?route=checkout/checkout',
  couponRoute: 'index.php?route=extension/total/coupon.coupon',
  invoiceRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.sendInvoice',
  syncToken: '',
  syncIntervalMs: 10 * 60 * 1000,
  pageLimit: 100,
  maxPages: 100,
  redirectDelayMs: 700
};
</script>

<script>
(function () {
  if (window.__AI_SHOPPING_ASSIST_LOADED__) return;
  window.__AI_SHOPPING_ASSIST_LOADED__ = true;

  const defaults = {
    apiBase: 'http://127.0.0.1:8000',
    catalogRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.getCatalog',
    cartRoute: 'index.php?route=checkout/cart',
    productRoute: 'index.php?route=product/product',
    searchRoute: 'index.php?route=product/search',
    cartInfoRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.getCart',
    cartActionRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.cartAction',
    checkoutRoute: 'index.php?route=checkout/checkout',
    couponRoute: 'index.php?route=extension/total/coupon.coupon',
    invoiceRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.sendInvoice',
    syncToken: '',
    syncIntervalMs: 10 * 60 * 1000,
    pageLimit: 100,
    maxPages: 100,
    redirectDelayMs: 700
  };
  const config = Object.assign({}, defaults, window.AI_SHOPPING_ASSIST_CONFIG || {});
  config.apiBase = String(config.apiBase || '').replace(/\/+$/, '');

  const storagePrefix = 'ai-shopping-assist:' + location.origin;
  const keys = {
    lastSync: storagePrefix + ':last-sync',
    conversationId: storagePrefix + ':conversation-id',
    cartSnapshot: storagePrefix + ':cart-snapshot'
  };

  const css = `
    #ai-shopping-assist-widget {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 99999;
      direction: rtl;
      font-family: inherit;
      color: #17202a;
    }
    #ai-shopping-assist-widget * {
      box-sizing: border-box;
    }
    .aisa-toggle {
      border: 0;
      min-width: 128px;
      height: 46px;
      padding: 0 18px;
      border-radius: 8px;
      color: #fff;
      background: #116466;
      box-shadow: 0 10px 30px rgba(17, 100, 102, .24);
      cursor: pointer;
      font-weight: 700;
    }
    .aisa-panel {
      width: min(390px, calc(100vw - 32px));
      height: min(560px, calc(100vh - 104px));
      margin-bottom: 12px;
      border: 1px solid #d8e2e1;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(16, 24, 40, .18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .aisa-panel[hidden] {
      display: none;
    }
    .aisa-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 12px 14px;
      border-bottom: 1px solid #e7eeee;
      background: #f7fbfa;
    }
    .aisa-title {
      font-weight: 800;
      line-height: 1.4;
    }
    .aisa-status {
      display: block;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
    }
    .aisa-close {
      width: 34px;
      height: 34px;
      border: 1px solid #d8e2e1;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .aisa-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      background: #fbfdfd;
    }
    .aisa-message {
      width: fit-content;
      max-width: 86%;
      margin: 0 0 10px;
      padding: 9px 11px;
      border-radius: 8px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    .aisa-message[dir="rtl"] {
      direction: rtl;
      text-align: right;
    }
    .aisa-message[dir="ltr"] {
      direction: ltr;
      text-align: left;
    }
    .aisa-message.user {
      margin-right: auto;
      color: #fff;
      background: #116466;
    }
    .aisa-message.bot {
      margin-left: auto;
      border: 1px solid #e1e9e8;
      background: #fff;
    }
    .aisa-form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e7eeee;
      background: #fff;
    }
    .aisa-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid #cedada;
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
    }
    .aisa-input:focus {
      border-color: #116466;
      box-shadow: 0 0 0 3px rgba(17, 100, 102, .12);
    }
    .aisa-send {
      width: 72px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #17202a;
      cursor: pointer;
      font-weight: 700;
    }
    .aisa-send:disabled,
    .aisa-toggle:disabled {
      opacity: .65;
      cursor: wait;
    }
    @media (max-width: 480px) {
      #ai-shopping-assist-widget {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }
      .aisa-panel {
        width: 100%;
      }
      .aisa-toggle {
        width: 100%;
      }
    }
  `;

  const root = document.createElement('div');
  root.id = 'ai-shopping-assist-widget';
  root.innerHTML = `
    <section class="aisa-panel" hidden aria-live="polite">
      <header class="aisa-head">
        <div>
          <div class="aisa-title">دستیار خرید</div>
          <span class="aisa-status">آماده</span>
        </div>
        <button type="button" class="aisa-close" aria-label="بستن">×</button>
      </header>
      <div class="aisa-messages"></div>
      <form class="aisa-form">
        <input class="aisa-input" type="text" autocomplete="off" placeholder="سوالت درباره محصول..." />
        <button class="aisa-send" type="submit">ارسال</button>
      </form>
    </section>
    <button type="button" class="aisa-toggle">دستیار خرید</button>
  `;

  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
  document.body.appendChild(root);

  const panel = root.querySelector('.aisa-panel');
  const toggle = root.querySelector('.aisa-toggle');
  const close = root.querySelector('.aisa-close');
  const messages = root.querySelector('.aisa-messages');
  const form = root.querySelector('.aisa-form');
  const input = root.querySelector('.aisa-input');
  const send = root.querySelector('.aisa-send');
  const status = root.querySelector('.aisa-status');

  toggle.addEventListener('click', function () {
    panel.hidden = false;
    toggle.hidden = true;
    input.focus();
  });

  close.addEventListener('click', function () {
    panel.hidden = true;
    toggle.hidden = false;
  });

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    addMessage('user', text);
    await askAssistant(text);
  });

  setTimeout(function () {
    syncCatalogIfNeeded(false).catch(function (error) {
      setStatus('خطا در بروزرسانی');
      console.warn('AI catalog sync failed:', error);
    });
  }, 600);

  function getShopBaseUrl() {
    const base = document.querySelector('base[href]');
    return base ? base.href : location.origin + '/';
  }

  function buildShopUrl(route) {
    return new URL(route, getShopBaseUrl());
  }

  function setStatus(text) {
    status.textContent = text;
  }

  function addMessage(role, text) {
    const cleanedText = stripAction(text);
    if (!cleanedText) return;

    const item = document.createElement('div');
    item.className = 'aisa-message ' + (role === 'user' ? 'user' : 'bot');
    item.dir = isRtlMessage(cleanedText) ? 'rtl' : 'ltr';
    item.textContent = cleanedText;
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  }

  function stripAction(text) {
    return String(text || '').replace(/\[ACTION:\s*ADD_TO_CART:[^\]]+\]/gi, '').trim();
  }

  function isRtlMessage(text) {
    const value = String(text || '');
    const rtlCount = (value.match(/[\u0590-\u08ff]/g) || []).length;
    const latinCount = (value.match(/[A-Za-z]/g) || []).length;
    return rtlCount > latinCount;
  }

  function getRequestedQuantity(action) {
    const rawQuantity = action && (action.requested_qty || action.qty || action.quantity);
    const quantity = Number(rawQuantity || 1);
    return Number.isFinite(quantity) && quantity > 0 ? Math.trunc(quantity) : 1;
  }

  function getActions(data) {
    if (Array.isArray(data.actions)) return data.actions;
    return data.action ? [data.action] : [];
  }

  function localizedAddedMessage(message, quantity) {
    if (isRtlMessage(message)) {
      return `${quantity} عدد محصول به سبد خرید شما اضافه شد.`;
    }
    return `Added ${quantity} ${quantity === 1 ? 'item' : 'items'} to your cart.`;
  }

  function localizedConnectionError(message) {
    if (isRtlMessage(message)) {
      return 'ارتباط با دستیار برقرار نشد. لطفا چند لحظه دیگر دوباره امتحان کن.';
    }
    return 'I could not connect to the assistant. Please try again in a moment.';
  }

  function localizedInvoiceSentMessage(message) {
    if (isRtlMessage(message)) {
      return 'درخواست فاکتور ثبت شد.';
    }
    return 'Invoice request sent.';
  }

  function localizedInvoiceFallbackMessage(message) {
    if (isRtlMessage(message)) {
      return 'ارسال خودکار فاکتور در دسترس نیست. شما را به صفحه پرداخت منتقل می‌کنم.';
    }
    return 'Automatic invoice sending is not available. I will take you to checkout.';
  }

  function localizedCartEmptyMessage(message) {
    if (isRtlMessage(message)) {
      return 'سبد خرید شما خالی است.';
    }
    return 'Your basket is empty.';
  }

  function localizedCartUnavailableMessage(message) {
    if (isRtlMessage(message)) {
      return 'فعلا نمی‌توانم سبد خرید زنده را بخوانم. صفحه سبد خرید را باز می‌کنم.';
    }
    return 'I cannot read the live basket yet. I will open the basket page.';
  }

  function localizedUpdatedMessage(message) {
    if (isRtlMessage(message)) {
      return 'سبد خرید به‌روزرسانی شد.';
    }
    return 'Your basket has been updated.';
  }

  function localizedRemovedMessage(message) {
    if (isRtlMessage(message)) {
      return 'محصول از سبد خرید حذف شد.';
    }
    return 'Removed the item from your basket.';
  }

  function localizedClearedMessage(message) {
    if (isRtlMessage(message)) {
      return 'سبد خرید خالی شد.';
    }
    return 'Your basket has been cleared.';
  }

  function localizedCouponMessage(message) {
    if (isRtlMessage(message)) {
      return 'کد تخفیف اعمال شد.';
    }
    return 'Coupon applied.';
  }

  function localizedActionFailedMessage(message) {
    if (isRtlMessage(message)) {
      return 'برای انجام این کار باید صفحه سبد خرید را باز کنم.';
    }
    return 'I need to open the basket page to complete that.';
  }

  async function askAssistant(message) {
    send.disabled = true;
    setStatus('در حال پاسخ');

    try {
      await syncCatalogIfNeeded(false);

      const body = { message: message };
      const conversationId = localStorage.getItem(keys.conversationId);
      if (conversationId) {
        body.conversation_id = conversationId;
      }

      const response = await fetch(config.apiBase + '/api/chat/', {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await response.json().catch(function () { return {}; });
      if (!response.ok || data.status !== 'success') {
        if (data.conversation_id) {
          localStorage.setItem(keys.conversationId, data.conversation_id);
        }
        if (data.reply) {
          addMessage('bot', data.reply);
          setStatus('خطا');
          return;
        }
        throw new Error(data.reply || 'Chat request failed');
      }

      if (data.conversation_id) {
        localStorage.setItem(keys.conversationId, data.conversation_id);
      }

      addMessage('bot', data.reply);

      for (const action of getActions(data)) {
        await handleAction(action, message, data);
      }

      setStatus('آماده');
    } catch (error) {
      console.error('AI assistant error:', error);
      addMessage('bot', localizedConnectionError(message));
      setStatus('خطا');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  async function syncCatalogIfNeeded(force) {
    const lastSync = Number(localStorage.getItem(keys.lastSync) || 0);
    if (!force && lastSync && Date.now() - lastSync < Number(config.syncIntervalMs)) {
      return;
    }

    setStatus('بروزرسانی کاتالوگ');
    const products = await crawlOpenCartCatalog();
    if (!products.length) {
      throw new Error('OpenCart catalog returned no products');
    }

    const headers = { 'Content-Type': 'application/json' };
    if (config.syncToken) {
      headers['X-AI-Assistant-Token'] = config.syncToken;
    }

    const response = await fetch(config.apiBase + '/api/catalog/import/', {
      method: 'POST',
      mode: 'cors',
      headers: headers,
      body: JSON.stringify({
        source: location.origin,
        products: products
      })
    });

    const data = await response.json();
    if (!response.ok || data.status !== 'success') {
      throw new Error(data.reply || 'Catalog import failed');
    }

    localStorage.setItem(keys.lastSync, String(Date.now()));
    setStatus('کاتالوگ تازه است');
  }

  async function crawlOpenCartCatalog() {
    const collected = [];
    const seen = new Set();
    const pageLimit = Number(config.pageLimit) || 100;
    const maxPages = Number(config.maxPages) || 100;

    for (let page = 1; page <= maxPages; page += 1) {
      const url = buildShopUrl(config.catalogRoute);
      url.searchParams.set('page', String(page));
      url.searchParams.set('limit', String(pageLimit));

      const response = await fetch(url.toString(), { credentials: 'same-origin' });
      if (!response.ok) {
        throw new Error('Catalog request failed: ' + response.status);
      }

      const payload = await response.json();
      if (payload.success === false) {
        throw new Error(payload.error || 'OpenCart catalog API failed');
      }

      const rows = extractProductRows(payload);
      if (!rows.length) break;

      rows.map(normalizeProduct).forEach(function (product) {
        if (!product.name) return;
        const key = product.product_id || product.name;
        if (seen.has(key)) return;
        seen.add(key);
        collected.push(product);
      });

      const total = Number(payload.total || (payload.pagination && payload.pagination.total) || 0);
      if (total && collected.length >= total) break;
      if (!total && rows.length < pageLimit) break;
    }

    return collected;
  }

  function extractProductRows(payload) {
    if (Array.isArray(payload)) return payload;
    if (Array.isArray(payload.data)) return payload.data;
    if (Array.isArray(payload.products)) return payload.products;
    if (payload.data && Array.isArray(payload.data.products)) return payload.data.products;
    return [];
  }

  function normalizeProduct(item) {
    const name = cleanText(firstPresent(item, ['name', 'product_name', 'title'], ''));
    return {
      product_id: cleanText(firstPresent(item, ['product_id', 'id', 'productId'], '')),
      name: name,
      product_url: cleanText(firstPresent(item, ['url', 'href', 'link', 'product_url', 'productUrl'], '')),
      price: cleanText(firstPresent(item, ['price', 'special'], '0')),
      stock: toInt(firstPresent(item, ['stock', 'quantity', 'qty'], 0)),
      category: cleanText(firstPresent(item, ['category', 'category_name', 'manufacturer'], 'Industrial Automation & Networking')),
      attributes: normalizeAttributes(firstPresent(item, ['attributes', 'attribute_groups', 'specifications'], null)),
      sales_angle: cleanText(firstPresent(item, ['sales_angle', 'description'], '')),
      alternatives: Array.isArray(item.alternatives) ? item.alternatives : []
    };
  }

  function firstPresent(source, names, fallback) {
    for (const name of names) {
      if (source && source[name] !== undefined && source[name] !== null && source[name] !== '') {
        return source[name];
      }
    }
    return fallback;
  }

  function cleanText(value) {
    const text = String(value === undefined || value === null ? '' : value);
    const div = document.createElement('div');
    div.innerHTML = text;
    return (div.textContent || div.innerText || '').trim();
  }

  function toInt(value) {
    const number = Number(String(value === undefined || value === null ? 0 : value).replace(/,/g, ''));
    return Number.isFinite(number) ? Math.trunc(number) : 0;
  }

  function normalizeAttributes(raw) {
    const out = {};

    if (raw && !Array.isArray(raw) && typeof raw === 'object') {
      Object.keys(raw).forEach(function (key) {
        const name = cleanText(key);
        const value = cleanText(raw[key]);
        if (name && value) out[name] = value;
      });
      return Object.keys(out).length ? out : {
        Interface: 'مشخصات پورت یافت نشد',
        Protection: 'استاندارد بدنه نامشخص'
      };
    }

    if (Array.isArray(raw)) {
      raw.forEach(function (entry) {
        if (!entry || typeof entry !== 'object') return;

        const nested = firstPresent(entry, ['attribute', 'attributes', 'items'], null);
        if (Array.isArray(nested)) {
          Object.assign(out, normalizeAttributes(nested));
          return;
        }

        const name = cleanText(firstPresent(entry, ['name', 'title', 'attribute_name'], ''));
        const value = cleanText(firstPresent(entry, ['text', 'value', 'attribute_value'], ''));
        if (name && value) out[name] = value;
      });
    }

    return Object.keys(out).length ? out : {
      Interface: 'مشخصات پورت یافت نشد',
      Protection: 'استاندارد بدنه نامشخص'
    };
  }

  async function handleAction(action, message, data) {
    const actionType = action.type || (action.product_id ? 'add_to_cart' : '');

    if (actionType === 'add_to_cart' && action.product_id) {
      const quantity = getRequestedQuantity(action);
      const added = await addToCart(action.product_id, quantity);
      if (added) {
        rememberCartItem(action, quantity);
        addMessage('bot', localizedAddedMessage(message, quantity));
      }
      return;
    }

    if (actionType === 'show_cart') {
      await showCart(message);
      return;
    }

    if (actionType === 'redirect_to_cart') {
      redirectToRoute(config.cartRoute);
      return;
    }

    if (actionType === 'redirect_to_product') {
      redirectToProduct(action);
      return;
    }

    if (actionType === 'update_cart_item') {
      const updated = await updateCartItem(action);
      addMessage('bot', updated ? localizedUpdatedMessage(message) : localizedActionFailedMessage(message));
      if (!updated) redirectToRoute(config.cartRoute);
      return;
    }

    if (actionType === 'remove_from_cart') {
      const removed = await removeCartItem(action);
      addMessage('bot', removed ? localizedRemovedMessage(message) : localizedActionFailedMessage(message));
      if (!removed) redirectToRoute(config.cartRoute);
      return;
    }

    if (actionType === 'clear_cart') {
      const cleared = await clearCart();
      addMessage('bot', cleared ? localizedClearedMessage(message) : localizedActionFailedMessage(message));
      if (!cleared) redirectToRoute(config.cartRoute);
      return;
    }

    if (actionType === 'apply_coupon') {
      const applied = await applyCoupon(action);
      addMessage('bot', applied ? localizedCouponMessage(message) : localizedActionFailedMessage(message));
      if (!applied) redirectToRoute(config.cartRoute);
      return;
    }

    if (actionType === 'redirect_to_checkout') {
      redirectToRoute(config.checkoutRoute);
      return;
    }

    if (actionType === 'send_invoice') {
      const sent = await requestInvoice(action, data);
      if (sent) {
        addMessage('bot', localizedInvoiceSentMessage(message));
        return;
      }
      addMessage('bot', localizedInvoiceFallbackMessage(message));
      redirectToRoute(config.checkoutRoute);
    }
  }

  function redirectToRoute(route) {
    if (!route) return;
    redirectToUrl(buildShopUrl(route).toString());
  }

  function redirectToUrl(url) {
    if (!url) return;
    const delay = Number(config.redirectDelayMs || 0);
    window.setTimeout(function () {
      try {
        window.location.assign(new URL(url, getShopBaseUrl()).toString());
      } catch (error) {
        window.location.assign(url);
      }
    }, Number.isFinite(delay) ? delay : 0);
  }

  function redirectToProduct(action) {
    const productUrl = String(action.product_url || action.url || action.href || '');
    if (productUrl) {
      redirectToUrl(productUrl);
      return;
    }

    if (action.product_id) {
      const url = buildShopUrl(config.productRoute);
      url.searchParams.set('product_id', String(action.product_id));
      redirectToUrl(url.toString());
      return;
    }

    if (action.product_name) {
      const url = buildShopUrl(config.searchRoute);
      url.searchParams.set('search', String(action.product_name));
      redirectToUrl(url.toString());
    }
  }

  async function requestInvoice(action, data) {
    if (!config.invoiceRoute) return false;
    const body = new URLSearchParams({
      email: action.email || '',
      invoice_type: action.invoice_type || 'invoice',
      note: action.note || '',
      conversation_id: data.conversation_id || ''
    });

    try {
      const response = await fetch(buildShopUrl(config.invoiceRoute).toString(), {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });
      const payload = await response.json().catch(function () { return {}; });
      return response.ok && payload.success !== false && payload.status !== 'error';
    } catch (error) {
      console.warn('OpenCart invoice request failed:', error);
      return false;
    }
  }

  async function showCart(message) {
    const cart = await getCart();
    if (cart.items.length) {
      addMessage('bot', formatCartSummary(cart, message));
      return;
    }
    if (cart.source === 'unavailable') {
      addMessage('bot', localizedCartUnavailableMessage(message));
      redirectToRoute(config.cartRoute);
      return;
    }
    addMessage('bot', localizedCartEmptyMessage(message));
  }

  async function getCart() {
    const jsonCart = await fetchCartJson(config.cartInfoRoute);
    if (jsonCart) return jsonCart;

    const htmlCart = await fetchCartHtml(config.cartRoute);
    if (htmlCart) return htmlCart;

    const localCart = loadLocalCart();
    if (localCart.items.length) return Object.assign({ source: 'local' }, localCart);

    return { source: 'unavailable', items: [], totals: [] };
  }

  async function fetchCartJson(route) {
    if (!route) return null;
    try {
      const response = await fetch(buildShopUrl(route).toString(), {
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json' }
      });
      const contentType = response.headers.get('content-type') || '';
      if (!response.ok || !contentType.includes('json')) return null;
      const payload = await response.json();
      return normalizeCartPayload(payload, 'json');
    } catch (error) {
      console.warn('OpenCart cart JSON request failed:', error);
      return null;
    }
  }

  async function fetchCartHtml(route) {
    if (!route) return null;
    try {
      const response = await fetch(buildShopUrl(route).toString(), {
        credentials: 'same-origin',
        headers: { 'Accept': 'text/html' }
      });
      const contentType = response.headers.get('content-type') || '';
      if (!response.ok || !contentType.includes('html')) return null;
      return parseCartHtml(await response.text());
    } catch (error) {
      console.warn('OpenCart cart HTML request failed:', error);
      return null;
    }
  }

  function normalizeCartPayload(payload, source) {
    const container = payload && (payload.data || payload.cart || payload);
    const rows = firstArray(
      container && container.products,
      container && container.items,
      container && container.lines,
      payload && payload.products,
      payload && payload.items
    );
    const items = rows.map(normalizeCartItem).filter(function (item) { return item.name; });
    const totals = firstArray(container && container.totals, payload && payload.totals);
    return { source: source, items: items, totals: totals, total: container && (container.total || container.total_formatted || container.subtotal) || '' };
  }

  function normalizeCartItem(row) {
    return {
      key: String(row.key || row.cart_id || row.cartId || row.id || ''),
      product_id: String(row.product_id || row.productId || ''),
      name: String(row.name || row.product_name || row.title || '').trim(),
      quantity: getRequestedQuantity({ requested_qty: row.quantity || row.qty || 1 }),
      price: String(row.price || row.unit_price || '').trim(),
      total: String(row.total || row.line_total || '').trim()
    };
  }

  function parseCartHtml(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const rows = Array.from(doc.querySelectorAll('form table tbody tr, .table-responsive table tbody tr'));
    const items = rows.map(function (row) {
      const quantityInput = row.querySelector('input[name^="quantity"]');
      const keyMatch = quantityInput && String(quantityInput.name || '').match(/\[([^\]]+)\]/);
      const cells = Array.from(row.querySelectorAll('td'));
      const link = row.querySelector('a[href*="product_id"], .text-start a, td a');
      const name = link ? link.textContent.trim() : (cells[1] && cells[1].textContent.trim()) || '';
      return {
        key: keyMatch ? keyMatch[1] : '',
        product_id: extractProductId((link && link.href) || ''),
        name: name.replace(/\s+/g, ' '),
        quantity: getRequestedQuantity({ requested_qty: quantityInput ? quantityInput.value : 1 }),
        price: (cells[cells.length - 2] && cells[cells.length - 2].textContent.trim()) || '',
        total: (cells[cells.length - 1] && cells[cells.length - 1].textContent.trim()) || ''
      };
    }).filter(function (item) { return item.name; });
    return { source: 'html', items: items, totals: [], total: '' };
  }

  function extractProductId(url) {
    try {
      return new URL(url, location.href).searchParams.get('product_id') || '';
    } catch (error) {
      return '';
    }
  }

  function firstArray() {
    for (let index = 0; index < arguments.length; index += 1) {
      if (Array.isArray(arguments[index])) return arguments[index];
    }
    return [];
  }

  function formatCartSummary(cart, message) {
    const lines = cart.items.map(function (item) {
      const qty = item.quantity || 1;
      const total = item.total || item.price || '';
      return total ? `${qty} x ${item.name} - ${total}` : `${qty} x ${item.name}`;
    });
    const totalLine = cart.total ? `\nTotal: ${cart.total}` : '';
    if (isRtlMessage(message)) {
      return `سبد خرید شما:\n${lines.join('\n')}${totalLine}`;
    }
    return `Your basket:\n${lines.join('\n')}${totalLine}`;
  }

  function loadLocalCart() {
    try {
      const parsed = JSON.parse(localStorage.getItem(keys.cartSnapshot) || '[]');
      return { source: 'local', items: Array.isArray(parsed) ? parsed : [], totals: [], total: '' };
    } catch (error) {
      return { source: 'local', items: [], totals: [], total: '' };
    }
  }

  function saveLocalCart(items) {
    localStorage.setItem(keys.cartSnapshot, JSON.stringify(items));
  }

  function rememberCartItem(action, quantity) {
    const cart = loadLocalCart();
    const productId = String(action.product_id || '');
    const existing = cart.items.find(function (item) {
      return productId && String(item.product_id) === productId;
    });
    if (existing) {
      existing.quantity = Number(existing.quantity || 0) + quantity;
    } else {
      cart.items.push({
        key: '',
        product_id: productId,
        name: action.product_name || productId,
        quantity: quantity,
        price: action.price || '',
        total: ''
      });
    }
    saveLocalCart(cart.items);
  }

  function findCartItem(cart, action) {
    const productId = String(action.product_id || '');
    const name = String(action.product_name || '').toLowerCase();
    return cart.items.find(function (item) {
      if (productId && String(item.product_id) === productId) return true;
      return name && String(item.name || '').toLowerCase().includes(name);
    });
  }

  async function postCartAction(actionType, params) {
    if (!config.cartActionRoute) return false;
    const body = new URLSearchParams(Object.assign({ action: actionType }, params || {}));
    try {
      const response = await fetch(buildShopUrl(config.cartActionRoute).toString(), {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });
      const payload = await response.json().catch(function () { return {}; });
      return response.ok && payload.success !== false && payload.status !== 'error';
    } catch (error) {
      console.warn('OpenCart cart action failed:', error);
      return false;
    }
  }

  async function updateCartItem(action) {
    const quantity = getRequestedQuantity(action);
    const cart = await getCart();
    const item = findCartItem(cart, action);
    const params = {
      product_id: action.product_id || (item && item.product_id) || '',
      key: (item && item.key) || '',
      quantity: String(quantity)
    };
    if (await postCartAction('update', params)) return true;
    if (item && item.key && await postCartEdit(item.key, quantity)) return true;
    if (cart.source === 'local' && item) {
      item.quantity = quantity;
      saveLocalCart(cart.items);
      return true;
    }
    return false;
  }

  async function removeCartItem(action) {
    const cart = await getCart();
    const item = findCartItem(cart, action);
    const params = {
      product_id: action.product_id || (item && item.product_id) || '',
      key: (item && item.key) || ''
    };
    if (await postCartAction('remove', params)) return true;
    if (item && item.key && await postCartRemove(item.key)) return true;
    if (cart.source === 'local' && item) {
      saveLocalCart(cart.items.filter(function (line) { return line !== item; }));
      return true;
    }
    return false;
  }

  async function clearCart() {
    if (await postCartAction('clear', {})) return true;
    const cart = await getCart();
    if (cart.items.length) {
      const results = await Promise.all(cart.items.map(function (item) {
        return item.key ? postCartRemove(item.key) : Promise.resolve(false);
      }));
      if (results.some(Boolean)) return true;
    }
    const localCart = loadLocalCart();
    if (localCart.items.length) {
      saveLocalCart([]);
      return true;
    }
    return false;
  }

  async function applyCoupon(action) {
    const code = action.code || '';
    if (!code) return false;
    if (await postCartAction('coupon', { code: code })) return true;
    if (!config.couponRoute) return false;
    try {
      const response = await fetch(buildShopUrl(config.couponRoute).toString(), {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ coupon: code, code: code })
      });
      const payload = await response.json().catch(function () { return {}; });
      return response.ok && payload.error === undefined && payload.status !== 'error';
    } catch (error) {
      console.warn('OpenCart coupon request failed:', error);
      return false;
    }
  }

  async function postCartEdit(key, quantity) {
    const body = new URLSearchParams({ key: key, quantity: String(quantity) });
    body.set(`quantity[${key}]`, String(quantity));
    return postFirstSuccessful(['index.php?route=checkout/cart.edit', 'index.php?route=checkout/cart/edit'], body);
  }

  async function postCartRemove(key) {
    return postFirstSuccessful(
      ['index.php?route=checkout/cart.remove', 'index.php?route=checkout/cart/remove'],
      new URLSearchParams({ key: key })
    );
  }

  async function postFirstSuccessful(routes, body) {
    for (const route of routes) {
      try {
        const response = await fetch(buildShopUrl(route).toString(), {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body
        });
        if (response.ok) return true;
      } catch (error) {
        console.warn('OpenCart request failed:', error);
      }
    }
    return false;
  }

  async function addToCart(productId, quantity) {
    const routes = [
      'index.php?route=checkout/cart.add',
      'index.php?route=checkout/cart/add'
    ];
    const body = new URLSearchParams({
      product_id: productId,
      quantity: String(quantity || 1)
    });

    for (const route of routes) {
      try {
        const response = await fetch(buildShopUrl(route).toString(), {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body
        });
        if (response.ok) return true;
      } catch (error) {
        console.warn('OpenCart add-to-cart failed:', error);
      }
    }

    return false;
  }
})();
</script>
