services:
  api:
    build: .
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-shopping_assist}:${POSTGRES_PASSWORD:-shopping_assist}@db:5432/${POSTGRES_DB:-shopping_assist}"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-before-production}
      AI_ASSISTANT_CORS_ALLOW_ALL: ${AI_ASSISTANT_CORS_ALLOW_ALL:-0}
      AI_ASSISTANT_ALLOWED_ORIGINS: ${AI_ASSISTANT_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      AI_ASSISTANT_SYNC_TOKEN: ${AI_ASSISTANT_SYNC_TOKEN:-}
      AI_ASSISTANT_MAX_CATALOG_ITEMS: ${AI_ASSISTANT_MAX_CATALOG_ITEMS:-5000}
      OPENCART_BASE_URL: ${OPENCART_BASE_URL:-}
      OPENCART_CATALOG_ROUTE: ${OPENCART_CATALOG_ROUTE:-index.php?route=extension/ai_shopping_assist/module/ai_shopping_assist.getCatalog}
      OPENCART_CATALOG_URL: ${OPENCART_CATALOG_URL:-}
      OPENCART_SYNC_TOKEN: ${OPENCART_SYNC_TOKEN:-}
      OPENCART_TIMEOUT: ${OPENCART_TIMEOUT:-15}
      CHAT_MEMORY_LIMIT: ${CHAT_MEMORY_LIMIT:-20}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
      GEMINI_API_KEY_5: ${GEMINI_API_KEY_5:-}
      GEMINI_API_KEY_6: ${GEMINI_API_KEY_6:-}
      GEMINI_API_KEY_7: ${GEMINI_API_KEY_7:-}
      GEMINI_API_KEY_8: ${GEMINI_API_KEY_8:-}
      GEMINI_API_KEY_9: ${GEMINI_API_KEY_9:-}
      GEMINI_API_KEY_10: ${GEMINI_API_KEY_10:-}
      GEMINI_API_KEY_11: ${GEMINI_API_KEY_11:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-flash-lite}
      GEMINI_RETRY_ATTEMPTS: ${GEMINI_RETRY_ATTEMPTS:-2}
      GEMINI_RETRY_BASE_DELAY: ${GEMINI_RETRY_BASE_DELAY:-1}
      GEMINI_RETRY_MAX_DELAY: ${GEMINI_RETRY_MAX_DELAY:-6}
      GEMINI_KEY_COOLDOWN_SECONDS: ${GEMINI_KEY_COOLDOWN_SECONDS:-30}
      GEMINI_KEY_COOLDOWN_MAX_SECONDS: ${GEMINI_KEY_COOLDOWN_MAX_SECONDS:-300}
      GEMINI_KEY_PERMISSION_COOLDOWN_SECONDS: ${GEMINI_KEY_PERMISSION_COOLDOWN_SECONDS:-3600}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopping_assist}
      POSTGRES_USER: ${POSTGRES_USER:-shopping_assist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopping_assist}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopping_assist} -d ${POSTGRES_DB:-shopping_assist}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
