<!--
Paste this block before </body> in:
catalog/view/theme/YOUR_THEME/template/common/footer.twig

Change apiBase to the public URL of the Django AI Shopping Assist API.
If your OpenCart catalog route is different, change catalogRoute too.
-->
<script>
window.AI_SHOPPING_ASSIST_CONFIG = window.AI_SHOPPING_ASSIST_CONFIG || {
  apiBase: 'http://127.0.0.1:8000',
  catalogRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.getCatalog',
  syncToken: '',
  syncIntervalMs: 10 * 60 * 1000,
  pageLimit: 100,
  maxPages: 100
};
</script>

<script>
(function () {
  if (window.__AI_SHOPPING_ASSIST_LOADED__) return;
  window.__AI_SHOPPING_ASSIST_LOADED__ = true;

  const defaults = {
    apiBase: 'http://127.0.0.1:8000',
    catalogRoute: 'index.php?route=extension/opencart/checkout/ai_assistant.getCatalog',
    syncToken: '',
    syncIntervalMs: 10 * 60 * 1000,
    pageLimit: 100,
    maxPages: 100
  };
  const config = Object.assign({}, defaults, window.AI_SHOPPING_ASSIST_CONFIG || {});
  config.apiBase = String(config.apiBase || '').replace(/\/+$/, '');

  const storagePrefix = 'ai-shopping-assist:' + location.origin;
  const keys = {
    lastSync: storagePrefix + ':last-sync',
    conversationId: storagePrefix + ':conversation-id'
  };

  const css = `
    #ai-shopping-assist-widget {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 99999;
      direction: rtl;
      font-family: inherit;
      color: #17202a;
    }
    #ai-shopping-assist-widget * {
      box-sizing: border-box;
    }
    .aisa-toggle {
      border: 0;
      min-width: 128px;
      height: 46px;
      padding: 0 18px;
      border-radius: 8px;
      color: #fff;
      background: #116466;
      box-shadow: 0 10px 30px rgba(17, 100, 102, .24);
      cursor: pointer;
      font-weight: 700;
    }
    .aisa-panel {
      width: min(390px, calc(100vw - 32px));
      height: min(560px, calc(100vh - 104px));
      margin-bottom: 12px;
      border: 1px solid #d8e2e1;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(16, 24, 40, .18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .aisa-panel[hidden] {
      display: none;
    }
    .aisa-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 12px 14px;
      border-bottom: 1px solid #e7eeee;
      background: #f7fbfa;
    }
    .aisa-title {
      font-weight: 800;
      line-height: 1.4;
    }
    .aisa-status {
      display: block;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
    }
    .aisa-close {
      width: 34px;
      height: 34px;
      border: 1px solid #d8e2e1;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .aisa-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      background: #fbfdfd;
    }
    .aisa-message {
      width: fit-content;
      max-width: 86%;
      margin: 0 0 10px;
      padding: 9px 11px;
      border-radius: 8px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    .aisa-message.user {
      margin-right: auto;
      color: #fff;
      background: #116466;
    }
    .aisa-message.bot {
      margin-left: auto;
      border: 1px solid #e1e9e8;
      background: #fff;
    }
    .aisa-form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e7eeee;
      background: #fff;
    }
    .aisa-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid #cedada;
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
    }
    .aisa-input:focus {
      border-color: #116466;
      box-shadow: 0 0 0 3px rgba(17, 100, 102, .12);
    }
    .aisa-send {
      width: 72px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #17202a;
      cursor: pointer;
      font-weight: 700;
    }
    .aisa-send:disabled,
    .aisa-toggle:disabled {
      opacity: .65;
      cursor: wait;
    }
    @media (max-width: 480px) {
      #ai-shopping-assist-widget {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }
      .aisa-panel {
        width: 100%;
      }
      .aisa-toggle {
        width: 100%;
      }
    }
  `;

  const root = document.createElement('div');
  root.id = 'ai-shopping-assist-widget';
  root.innerHTML = `
    <section class="aisa-panel" hidden aria-live="polite">
      <header class="aisa-head">
        <div>
          <div class="aisa-title">دستیار خرید</div>
          <span class="aisa-status">آماده</span>
        </div>
        <button type="button" class="aisa-close" aria-label="بستن">×</button>
      </header>
      <div class="aisa-messages"></div>
      <form class="aisa-form">
        <input class="aisa-input" type="text" autocomplete="off" placeholder="سوالت درباره محصول..." />
        <button class="aisa-send" type="submit">ارسال</button>
      </form>
    </section>
    <button type="button" class="aisa-toggle">دستیار خرید</button>
  `;

  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
  document.body.appendChild(root);

  const panel = root.querySelector('.aisa-panel');
  const toggle = root.querySelector('.aisa-toggle');
  const close = root.querySelector('.aisa-close');
  const messages = root.querySelector('.aisa-messages');
  const form = root.querySelector('.aisa-form');
  const input = root.querySelector('.aisa-input');
  const send = root.querySelector('.aisa-send');
  const status = root.querySelector('.aisa-status');

  toggle.addEventListener('click', function () {
    panel.hidden = false;
    toggle.hidden = true;
    input.focus();
  });

  close.addEventListener('click', function () {
    panel.hidden = true;
    toggle.hidden = false;
  });

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    addMessage('user', text);
    await askAssistant(text);
  });

  setTimeout(function () {
    syncCatalogIfNeeded(false).catch(function (error) {
      setStatus('خطا در بروزرسانی');
      console.warn('AI catalog sync failed:', error);
    });
  }, 600);

  function getShopBaseUrl() {
    const base = document.querySelector('base[href]');
    return base ? base.href : location.origin + '/';
  }

  function buildShopUrl(route) {
    return new URL(route, getShopBaseUrl());
  }

  function setStatus(text) {
    status.textContent = text;
  }

  function addMessage(role, text) {
    const item = document.createElement('div');
    item.className = 'aisa-message ' + (role === 'user' ? 'user' : 'bot');
    item.textContent = stripAction(text);
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  }

  function stripAction(text) {
    return String(text || '').replace(/\[ACTION:\s*ADD_TO_CART:[^\]]+\]/gi, '').trim();
  }

  async function askAssistant(message) {
    send.disabled = true;
    setStatus('در حال پاسخ');

    try {
      await syncCatalogIfNeeded(false);

      const body = { message: message };
      const conversationId = localStorage.getItem(keys.conversationId);
      if (conversationId) {
        body.conversation_id = conversationId;
      }

      const response = await fetch(config.apiBase + '/api/chat/', {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await response.json();
      if (!response.ok || data.status !== 'success') {
        throw new Error(data.reply || 'Chat request failed');
      }

      if (data.conversation_id) {
        localStorage.setItem(keys.conversationId, data.conversation_id);
      }

      addMessage('bot', data.reply);

      if (data.action && data.action.product_id) {
        const added = await addToCart(data.action.product_id);
        if (added) {
          addMessage('bot', 'محصول به سبد خرید اضافه شد.');
        }
      }

      setStatus('آماده');
    } catch (error) {
      console.error('AI assistant error:', error);
      addMessage('bot', 'ارتباط با دستیار برقرار نشد. لطفا چند لحظه دیگر دوباره امتحان کن.');
      setStatus('خطا');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  async function syncCatalogIfNeeded(force) {
    const lastSync = Number(localStorage.getItem(keys.lastSync) || 0);
    if (!force && lastSync && Date.now() - lastSync < Number(config.syncIntervalMs)) {
      return;
    }

    setStatus('بروزرسانی کاتالوگ');
    const products = await crawlOpenCartCatalog();
    if (!products.length) {
      throw new Error('OpenCart catalog returned no products');
    }

    const headers = { 'Content-Type': 'application/json' };
    if (config.syncToken) {
      headers['X-AI-Assistant-Token'] = config.syncToken;
    }

    const response = await fetch(config.apiBase + '/api/catalog/import/', {
      method: 'POST',
      mode: 'cors',
      headers: headers,
      body: JSON.stringify({
        source: location.origin,
        products: products
      })
    });

    const data = await response.json();
    if (!response.ok || data.status !== 'success') {
      throw new Error(data.reply || 'Catalog import failed');
    }

    localStorage.setItem(keys.lastSync, String(Date.now()));
    setStatus('کاتالوگ تازه است');
  }

  async function crawlOpenCartCatalog() {
    const collected = [];
    const seen = new Set();
    const pageLimit = Number(config.pageLimit) || 100;
    const maxPages = Number(config.maxPages) || 100;

    for (let page = 1; page <= maxPages; page += 1) {
      const url = buildShopUrl(config.catalogRoute);
      url.searchParams.set('page', String(page));
      url.searchParams.set('limit', String(pageLimit));

      const response = await fetch(url.toString(), { credentials: 'same-origin' });
      if (!response.ok) {
        throw new Error('Catalog request failed: ' + response.status);
      }

      const payload = await response.json();
      if (payload.success === false) {
        throw new Error(payload.error || 'OpenCart catalog API failed');
      }

      const rows = extractProductRows(payload);
      if (!rows.length) break;

      rows.map(normalizeProduct).forEach(function (product) {
        if (!product.name) return;
        const key = product.product_id || product.name;
        if (seen.has(key)) return;
        seen.add(key);
        collected.push(product);
      });

      const total = Number(payload.total || (payload.pagination && payload.pagination.total) || 0);
      if (total && collected.length >= total) break;
      if (!total && rows.length < pageLimit) break;
    }

    return collected;
  }

  function extractProductRows(payload) {
    if (Array.isArray(payload)) return payload;
    if (Array.isArray(payload.data)) return payload.data;
    if (Array.isArray(payload.products)) return payload.products;
    if (payload.data && Array.isArray(payload.data.products)) return payload.data.products;
    return [];
  }

  function normalizeProduct(item) {
    const name = cleanText(firstPresent(item, ['name', 'product_name', 'title'], ''));
    return {
      product_id: cleanText(firstPresent(item, ['product_id', 'id', 'productId'], '')),
      name: name,
      price: cleanText(firstPresent(item, ['price', 'special'], '0')),
      stock: toInt(firstPresent(item, ['stock', 'quantity', 'qty'], 0)),
      category: cleanText(firstPresent(item, ['category', 'category_name', 'manufacturer'], 'Industrial Automation & Networking')),
      attributes: normalizeAttributes(firstPresent(item, ['attributes', 'attribute_groups', 'specifications'], null)),
      sales_angle: cleanText(firstPresent(item, ['sales_angle', 'description'], '')),
      alternatives: Array.isArray(item.alternatives) ? item.alternatives : []
    };
  }

  function firstPresent(source, names, fallback) {
    for (const name of names) {
      if (source && source[name] !== undefined && source[name] !== null && source[name] !== '') {
        return source[name];
      }
    }
    return fallback;
  }

  function cleanText(value) {
    const text = String(value === undefined || value === null ? '' : value);
    const div = document.createElement('div');
    div.innerHTML = text;
    return (div.textContent || div.innerText || '').trim();
  }

  function toInt(value) {
    const number = Number(String(value === undefined || value === null ? 0 : value).replace(/,/g, ''));
    return Number.isFinite(number) ? Math.trunc(number) : 0;
  }

  function normalizeAttributes(raw) {
    const out = {};

    if (raw && !Array.isArray(raw) && typeof raw === 'object') {
      Object.keys(raw).forEach(function (key) {
        const name = cleanText(key);
        const value = cleanText(raw[key]);
        if (name && value) out[name] = value;
      });
      return Object.keys(out).length ? out : {
        Interface: 'مشخصات پورت یافت نشد',
        Protection: 'استاندارد بدنه نامشخص'
      };
    }

    if (Array.isArray(raw)) {
      raw.forEach(function (entry) {
        if (!entry || typeof entry !== 'object') return;

        const nested = firstPresent(entry, ['attribute', 'attributes', 'items'], null);
        if (Array.isArray(nested)) {
          Object.assign(out, normalizeAttributes(nested));
          return;
        }

        const name = cleanText(firstPresent(entry, ['name', 'title', 'attribute_name'], ''));
        const value = cleanText(firstPresent(entry, ['text', 'value', 'attribute_value'], ''));
        if (name && value) out[name] = value;
      });
    }

    return Object.keys(out).length ? out : {
      Interface: 'مشخصات پورت یافت نشد',
      Protection: 'استاندارد بدنه نامشخص'
    };
  }

  async function addToCart(productId) {
    const routes = [
      'index.php?route=checkout/cart.add',
      'index.php?route=checkout/cart/add'
    ];
    const body = new URLSearchParams({
      product_id: productId,
      quantity: '1'
    });

    for (const route of routes) {
      try {
        const response = await fetch(buildShopUrl(route).toString(), {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body
        });
        if (response.ok) return true;
      } catch (error) {
        console.warn('OpenCart add-to-cart failed:', error);
      }
    }

    return false;
  }
})();
</script>
